<script>
// Contingut legal multilingüe. El selector d'idioma comú desa la preferència.
const privacyTranslations = {"ca":{"title":"Política de privacitat","sections":[["Responsable del tractament","L’Agrupació Musical Senienca, NIF G43213099, inscrita al Registre d’Associacions del Departament de Justícia i Qualitat Democràtica de la Generalitat de Catalunya, amb domicili al carrer Bisbe Berenguer de Prats, 7, La Sénia (Tarragona), és responsable del tractament de les dades personals recollides a través dels formularis del Certamen. Contacte: <a href='mailto:info@certamen.cat'>info@certamen.cat</a>."],["Dades que recollim","Al formulari de contacte: nom, correu electrònic, banda o entitat (si s’indica) i missatge. Al formulari d’inscripció: dades identificatives i de contacte de la banda i de les persones representants, i la resta d’informació facilitada per gestionar la sol·licitud. No inclogueu dades sensibles innecessàries als camps lliures."],["Finalitats i base jurídica","Tractem les dades de contacte per respondre les consultes i les d’inscripció per tramitar la candidatura, comunicar-nos amb la banda i gestionar la participació en el Certamen. La base jurídica és la gestió de les mesures sol·licitades per la persona interessada i, quan correspongui, l’interès legítim de l’entitat a atendre consultes vinculades a la seva activitat, sense perjudici de les obligacions legals aplicables. Quan es facilitin dades d’altres persones, qui les comuniqui haurà d’haver-les informat adequadament."],["Destinataris i eines utilitzades","Les dades són accessibles a les persones autoritzades de l’organització. Els formularis utilitzen Google Apps Script, Google Sheets i correu electrònic per rebre, registrar i gestionar les sol·licituds; Cal verificar les condicions contractuals i les garanties aplicables als serveis de Google utilitzats amb el compte gratuït exclusiu del Certamen. No es preveu comunicar les dades a tercers fora dels casos necessaris per a la gestió del Certamen o exigits legalment. Els serveis de Google poden implicar transferències internacionals de dades, amb les garanties que corresponguin."],["Conservació","Les dades personals de les inscripcions es conservaran durant l’edició corresponent i fins a un any després que finalitzi, excepte quan sigui necessari conservar-les més temps per una obligació legal o per atendre reclamacions. Les consultes es conservaran el temps necessari per respondre-les i gestionar-ne el seguiment, amb els terminis legals aplicables. La informació històrica de bandes, participació i resultats es gestionarà separadament i es limitaran les dades personals publicades."],["Drets de les persones","Podeu sol·licitar l’accés, la rectificació, la supressió, l’oposició, la limitació del tractament i, quan sigui aplicable, la portabilitat de les vostres dades escrivint a <a href='mailto:info@certamen.cat'>info@certamen.cat</a>. També podeu presentar una reclamació davant l’Agencia Española de Protección de Datos (<a href='https://www.aepd.es/' rel='noopener noreferrer'>APDCAT</a>)."],["Informació sobre la inscripció","L’enviament d’una sol·licitud no implica l’admissió al Certamen. Si una banda és seleccionada, els tractaments addicionals vinculats a la identificació dels músics, els drets d’imatge o la difusió d’actuacions es comunicaran específicament quan pertoqui."]]},"es":{"title":"Política de privacidad","sections":[["Responsable del tratamiento","La Agrupació Musical Senienca, NIF G43213099, inscrita en el Registro de Asociaciones del Departamento de Justicia y Calidad Democrática de la Generalitat de Catalunya, con domicilio en la calle Bisbe Berenguer de Prats, 7, La Sénia (Tarragona), es responsable del tratamiento. Contacto: <a href='mailto:info@certamen.cat'>info@certamen.cat</a>."],["Datos recogidos","En el formulario de contacto: nombre, correo electrónico, banda o entidad (opcional) y mensaje. En la inscripción: datos identificativos y de contacto de la banda y sus representantes, y demás información facilitada para tramitar la solicitud. No incluya datos sensibles innecesarios en los campos libres."],["Finalidades y base jurídica","Los datos se utilizan para responder consultas, tramitar candidaturas, contactar con las bandas y gestionar su participación. El tratamiento se basa en las medidas solicitadas por la persona interesada y, cuando proceda, en el interés legítimo de la entidad en atender consultas relacionadas con su actividad, sin perjuicio de las obligaciones legales. Si facilita datos de terceros, deberá informarles adecuadamente."],["Destinatarios y herramientas","Solo accederá el personal autorizado de la organización. Se utilizan Google Apps Script, Google Sheets y correo electrónico para recibir y gestionar solicitudes. Deben verificarse las condiciones contractuales y las garantías de los servicios de Google utilizados con la cuenta gratuita exclusiva del Certamen. No se prevén cesiones a terceros salvo las necesarias para la gestión o por obligación legal. Los servicios de Google pueden implicar transferencias internacionales con las garantías correspondientes."],["Conservación","Los datos personales de las inscripciones se conservarán durante la edición y hasta un año después de su finalización, salvo obligaciones legales o reclamaciones. Las consultas se conservarán el tiempo necesario para responder y realizar el seguimiento, respetando los plazos legales. Los datos históricos de bandas, participación y resultados se gestionarán por separado, limitando los datos personales publicados."],["Derechos","Puede solicitar acceso, rectificación, supresión, oposición, limitación y, cuando proceda, portabilidad escribiendo a <a href='mailto:info@certamen.cat'>info@certamen.cat</a>. También puede reclamar ante la <a href='https://www.aepd.es/' rel='noopener noreferrer'>Agencia Española de Protección de Datos (AEPD)</a>."],["Información adicional","Presentar una solicitud no implica la admisión. Si la banda resulta seleccionada, se informará específicamente de los tratamientos adicionales de identificación de músicos, derechos de imagen o difusión de actuaciones."]]},"gl":{"title":"Política de privacidade","sections":[["Responsable do tratamento","A Agrupació Musical Senienca, NIF G43213099, inscrita no Rexistro de Asociacións do Departamento de Xustiza e Calidade Democrática da Generalitat de Catalunya, con domicilio na rúa Bisbe Berenguer de Prats, 7, La Sénia (Tarragona), é responsable do tratamento. Contacto: <a href='mailto:info@certamen.cat'>info@certamen.cat</a>."],["Datos recollidos","No formulario de contacto: nome, correo electrónico, banda ou entidade (opcional) e mensaxe. Na inscrición: datos identificativos e de contacto da banda e das persoas representantes e demais información necesaria para tramitar a solicitude. Non inclúa datos sensibles innecesarios nos campos libres."],["Finalidades e base xurídica","Os datos utilízanse para responder consultas, tramitar candidaturas, contactar coas bandas e xestionar a participación. O tratamento baséase nas medidas solicitadas pola persoa interesada e, cando proceda, no interese lexítimo da entidade en atender consultas relacionadas coa súa actividade, sen prexuízo das obrigas legais. Se facilita datos doutras persoas, deberá informalas."],["Destinatarios e ferramentas","Accederá unicamente o persoal autorizado. Utilízanse Google Apps Script, Google Sheets e correo electrónico para recibir e xestionar solicitudes. Cómpre verificar as condicións contractuais e as garantías dos servizos de Google utilizados coa conta gratuíta exclusiva do Certame. Non se prevén comunicacións a terceiros salvo as necesarias para a xestión ou por obriga legal. Os servizos de Google poden implicar transferencias internacionais coas garantías correspondentes."],["Conservación","Os datos persoais das inscricións conservaranse durante a edición e ata un ano despois da súa finalización, salvo obrigas legais ou reclamacións. As consultas conservaranse o tempo necesario para respondelas e facer seguimento, respectando os prazos legais. A información histórica sobre bandas, participación e resultados xestionarase por separado, limitando os datos persoais publicados."],["Dereitos","Pode solicitar acceso, rectificación, supresión, oposición, limitación e, cando proceda, portabilidade escribindo a <a href='mailto:info@certamen.cat'>info@certamen.cat</a>. Tamén pode reclamar ante a <a href='https://www.aepd.es/' rel='noopener noreferrer'>Agencia Española de Protección de Datos (AEPD)</a>."],["Información adicional","Presentar unha solicitude non implica a admisión. Se a banda resulta seleccionada, informarase especificamente sobre os tratamentos adicionais relativos á identificación dos músicos, dereitos de imaxe e difusión das actuacións."]]},"pt":{"title":"Política de privacidade","sections":[["Responsável pelo tratamento","A Agrupació Musical Senienca, NIF G43213099, inscrita no Registo de Associações do Departamento de Justiça e Qualidade Democrática da Generalitat de Catalunya, com sede na Carrer Bisbe Berenguer de Prats, 7, La Sénia (Tarragona), é responsável pelo tratamento. Contacto: <a href='mailto:info@certamen.cat'>info@certamen.cat</a>."],["Dados recolhidos","No formulário de contacto: nome, email, banda ou entidade (opcional) e mensagem. Na inscrição: dados de identificação e contacto da banda e dos seus representantes, bem como outras informações necessárias para gerir a candidatura. Não inclua dados sensíveis desnecessários nos campos livres."],["Finalidades e fundamento jurídico","Os dados são utilizados para responder a pedidos, processar candidaturas, contactar as bandas e gerir a participação. O tratamento baseia-se nas diligências solicitadas pelo titular dos dados e, quando aplicável, no interesse legítimo da associação em responder a pedidos relacionados com a sua atividade, sem prejuízo das obrigações legais. Ao fornecer dados de terceiros, deve informá-los adequadamente."],["Destinatários e ferramentas","Apenas pessoas autorizadas da organização terão acesso. Utilizamos Google Apps Script, Google Sheets e email para receber e gerir pedidos. É necessário verificar as condições contratuais e as garantias dos serviços Google utilizados com a conta gratuita exclusiva do Certame. Não se prevê a divulgação a terceiros, exceto quando necessária à gestão ou legalmente exigida. Os serviços Google podem envolver transferências internacionais com as garantias adequadas."],["Conservação","Os dados pessoais das inscrições serão conservados durante a edição e até um ano após o seu encerramento, salvo obrigações legais ou reclamações. Os pedidos de informação serão conservados pelo período necessário à resposta e acompanhamento, respeitando os prazos legais. O histórico de bandas, participações e resultados será gerido separadamente, limitando os dados pessoais publicados."],["Direitos","Pode solicitar acesso, retificação, apagamento, oposição, limitação e, quando aplicável, portabilidade através de <a href='mailto:info@certamen.cat'>info@certamen.cat</a>. Pode também apresentar reclamação à <a href='https://www.aepd.es/' rel='noopener noreferrer'>Agencia Española de Protección de Datos (AEPD)</a>."],["Informação adicional","A candidatura não implica admissão. Se a banda for selecionada, serão prestadas informações específicas sobre tratamentos adicionais relativos à identificação de músicos, direitos de imagem e divulgação de atuações."]]},"en":{"title":"Privacy policy","sections":[["Data controller","Agrupació Musical Senienca, tax ID G43213099, registered with the Associations Register of the Department of Justice and Democratic Quality of the Government of Catalonia, at Carrer Bisbe Berenguer de Prats, 7, La Sénia (Tarragona), Spain, is the data controller. Contact: <a href='mailto:info@certamen.cat'>info@certamen.cat</a>."],["Data collected","The contact form collects your name, email address, optional band or organisation and message. The registration form collects identification and contact details of the band and its representatives, and other information submitted to process the application. Please do not enter unnecessary sensitive information in free-text fields."],["Purposes and legal basis","We process information to answer enquiries, review applications, communicate with bands and organise participation. Processing is based on steps requested by the data subject and, where applicable, the association's legitimate interest in responding to enquiries related to its activities, without prejudice to legal obligations. If you provide another person's data, you must inform them appropriately."],["Recipients and service providers","Only authorised organisers can access the data. We use Google Apps Script, Google Sheets and email to receive and manage submissions. The contractual terms and safeguards for the Google services used with the Competition's dedicated free account must be verified. Data is not routinely disclosed to third parties except where necessary for the competition or legally required. Google's services may involve international data transfers subject to applicable safeguards."],["Retention","Registration data is kept throughout the relevant edition and for one year after it ends, unless a longer period is required by law or to handle claims. Enquiries are kept as long as necessary to respond and follow up, subject to legal requirements. Historical information on bands, participation and results is managed separately, with published personal data minimised."],["Your rights","You may request access, rectification, erasure, objection, restriction and, where applicable, portability by emailing <a href='mailto:info@certamen.cat'>info@certamen.cat</a>. You may also complain to the <a href='https://www.aepd.es/' rel='noopener noreferrer'>Spanish Data Protection Agency (AEPD)</a>."],["Further information","Submitting an application does not guarantee admission. Selected bands will receive specific information about any additional processing involving musician identification, image rights or publication of performances."]]}};
function renderPrivacy(lang) {
  const entry = privacyTranslations[lang] || privacyTranslations.ca;
  document.getElementById('privacy-content').innerHTML = '<h1>' + entry.title + '</h1>' + entry.sections.map(section => '<section style="margin:1.5rem 0"><h2>' + section[0] + '</h2><p>' + section[1] + '</p></section>').join('');
}
function currentPrivacyLanguage() { try { return localStorage.getItem('certamen-lang') || localStorage.getItem('certamenLang') || 'ca'; } catch (_) { return 'ca'; } }
document.addEventListener('DOMContentLoaded', () => {
  renderPrivacy(currentPrivacyLanguage());
  document.querySelectorAll('.lang-menu [data-lang]').forEach(button => button.addEventListener('click', () => renderPrivacy(button.dataset.lang)));
});
</script>
